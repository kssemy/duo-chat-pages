<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>둘만의 채팅</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23212121'/%3E%3Cpath d='M15 18h34v23H28L16 51V41h-1z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#202123;background:#fff;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}
    .app{height:100dvh;display:grid;grid-template-columns:260px minmax(0,1fr);overflow:hidden}
    .sidebar{background:#f9f9f9;display:flex;flex-direction:column;padding:18px 12px;color:#282828}
    .brand{display:flex;align-items:center;justify-content:space-between;padding:5px 8px 18px;font-weight:700;font-size:19px;letter-spacing:-.035em}
    .brand-mark{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:10px;background:#202020;color:white;font-size:19px;letter-spacing:-.08em;margin-right:8px}
    .icon{border:0;background:transparent;color:#575757;width:32px;height:32px;border-radius:9px;display:inline-grid;place-items:center;font-size:20px}
    .icon:hover,.side-item:hover{background:#eaeaea}.side-item{border:0;background:transparent;width:100%;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;text-align:left;color:#333;font-size:14px}
    .side-item.active{background:#ededed;font-weight:600}.side-item svg{flex:none}.side-heading{color:#797979;font-size:12px;font-weight:600;padding:24px 11px 8px}
    .side-spacer{flex:1}.profile{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:13px;border-top:1px solid #ececec}
    .avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#d8c6b2;color:#3e3025;font-size:13px;font-weight:700}.profile small{display:block;color:#838383;margin-top:3px}
    .main{display:flex;flex-direction:column;min-width:0}.topbar{height:60px;min-height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 25px}
    .top-title{font-size:18px;font-weight:600;letter-spacing:-.035em}.top-right{display:flex;align-items:center;gap:10px;color:#888;font-size:12px}
    .status-dot{width:7px;height:7px;border-radius:50%;background:#30a46c}.status-dot.off{background:#b8b8b8}
    .menu{display:none}.conversation{flex:1;overflow:auto;scrollbar-color:#d6d6d6 transparent}
    .messages{width:min(100%,800px);min-height:100%;margin:auto;padding:35px 28px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:25px}
    .empty{margin:auto;text-align:center;color:#292929;font-size:27px;font-weight:600;letter-spacing:-.045em}.empty small{display:block;color:#8b8b8b;font-weight:400;font-size:14px;margin-top:13px;letter-spacing:0}
    .row{display:flex;flex-direction:column;gap:7px;max-width:78%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55}.row.mine{align-self:flex-end;align-items:flex-end}.row.theirs{align-self:flex-start;align-items:flex-start}
    .bubble{padding:11px 16px;border-radius:20px;background:#f4f4f4}.mine .bubble{background:#e9e9e9}.meta{color:#999;font-size:11px;padding:0 5px}
    .composer-wrap{padding:14px 28px 22px;background:linear-gradient(transparent,#fff 20%)}.composer{width:min(100%,800px);margin:auto;border:1px solid #e5e5e5;border-radius:24px;box-shadow:0 3px 14px #0000000c;background:#fff;padding:15px 16px 12px}
    textarea{display:block;border:0;outline:0;resize:none;width:100%;min-height:36px;max-height:180px;font-size:15px;line-height:1.5;color:#222;background:transparent}textarea::placeholder{color:#989898}
    .composer-actions{display:flex;align-items:center;justify-content:space-between;margin-top:4px}.hint{font-size:11px;color:#a0a0a0;padding-left:6px}.send{border:0;border-radius:50%;background:#171717;color:#fff;width:33px;height:33px;display:grid;place-items:center;font-size:20px}.send:disabled{background:#d1d1d1;cursor:default}
    .notice{width:min(100%,800px);margin:0 auto 8px;padding:10px 14px;border-radius:10px;background:#fff5e8;color:#805415;font-size:13px}.notice[hidden]{display:none}
    @media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:absolute;z-index:2;inset:0 auto 0 0;width:260px;box-shadow:8px 0 30px #0002;transform:translateX(-110%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.menu{display:inline-grid}.topbar{padding:0 16px}.top-title{margin-right:auto;margin-left:8px}.messages{padding:18px 18px 12px}.composer-wrap{padding:8px 12px 14px}.row{max-width:88%}.empty{font-size:23px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span><span class="brand-mark">✦</span>둘만의 채팅</span><button class="icon" id="closeMenu" aria-label="메뉴 닫기">‹</button></div>
      <button class="side-item active" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v12H8l-4 3V5z"/></svg>채팅</button>
      <div class="side-heading">대화</div>
      <button class="side-item active" type="button"><span aria-hidden="true">●</span>우리의 대화</button>
      <div class="side-spacer"></div>
      <div class="profile"><span class="avatar" id="avatar">나</span><span><strong id="profileName">나</strong><small>1:1 채팅</small></span></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="icon menu" id="openMenu" aria-label="메뉴 열기">☰</button><span class="top-title">우리의 대화</span><span class="top-right"><span class="status-dot off" id="statusDot"></span><span id="statusText">연결 준비 중</span></span></header>
      <section class="conversation" id="conversation" aria-label="대화 내용"><div class="messages" id="messages"><div class="empty" id="empty">대화를 시작해볼까요?<small>두 사람만의 공간입니다.</small></div></div></section>
      <div class="composer-wrap"><div class="notice" id="notice" hidden></div><form class="composer" id="form"><textarea id="messageInput" placeholder="메시지를 입력하세요" aria-label="메시지 입력" rows="1" maxlength="4000"></textarea><div class="composer-actions"><span class="hint">Enter 전송 · Shift+Enter 줄바꿈</span><button class="send" id="send" type="submit" aria-label="메시지 보내기" disabled>↑</button></div></form></div>
    </main>
  </div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
