<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f9f9">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>ChatGPT</title>
  <link rel="icon" href="./icon.svg">
  <style>
    :root{font-family:Arial,"Malgun Gothic",sans-serif;color:#292b2d;background:#fff;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{cursor:pointer}
    .app{height:100dvh;display:grid;grid-template-columns:51px 239px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr);overflow:hidden}
    .windowbar{grid-column:1/-1;background:#f7f6ef;border-bottom:1px solid #e8e8e3;display:flex;align-items:center;gap:18px;padding:0 13px;color:#949794;font-size:13px}
    .windowbar .arrow{font-size:21px;font-weight:300}.windowbar .win-spacer{flex:1}.windowbar .win-button{color:#333;font-size:14px;min-width:18px;text-align:center}
    .rail{background:linear-gradient(#f7f8f6,#f4f7e8);border-right:1px solid #e8e9e5;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:12px;color:#888c8a}
    .rail-icon{border:0;background:none;width:36px;height:36px;border-radius:11px;color:inherit;display:grid;place-items:center;font-size:21px;line-height:1}.rail-icon.selected{background:#e9eae6;color:#262a2a}.rail-icon:hover{background:#e8ebe4}.rail-icon.tiny{font-size:17px}.rail .spacer{flex:1}.rail .dot{width:7px;height:7px;border-radius:50%;background:#4b93ff;position:absolute;margin:20px 0 0 24px}.rail-avatar{width:24px;height:24px;border:0;border-radius:50%;background:#1989fc;color:white;font-size:12px;font-weight:700;margin-bottom:3px}
    .sidebar{background:#fafaf8;border-right:1px solid #e4e4e0;display:flex;flex-direction:column;min-width:0}
    .side-top{height:51px;display:flex;align-items:center;padding:0 16px;gap:7px;font-size:16px;font-weight:650}.side-top .spacer{flex:1}.side-icon{border:0;background:none;color:#777;width:25px;height:27px;font-size:17px;padding:0}
    .side-scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:#dededb transparent;padding:0 9px 28px}.side-action,.side-entry,.side-folder{height:31px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:9px;color:#585b5a;font-size:13px;white-space:nowrap;overflow:hidden}.side-entry{padding-left:9px}.side-entry.indent{padding-left:30px}.side-entry.selected{background:#efefec;color:#303130}.side-action{margin:3px 0 14px}.side-folder{font-weight:500;color:#4a4d4c}.side-heading{font-size:13px;color:#a0a29f;font-weight:600;padding:14px 8px 6px}.side-section{margin-bottom:5px}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.folder-icon{font-size:16px;line-height:1}.side-action:hover,.side-entry:hover,.side-folder:hover{background:#f0f0ed}
    .main{min-width:0;display:flex;flex-direction:column;background:#fff;position:relative}.topbar{height:52px;min-height:52px;display:flex;align-items:center;padding:0 18px;gap:12px}.topbar .title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar .spacer{flex:1}.top-icon{border:0;background:none;color:#898d90;width:24px;height:26px;font-size:18px;padding:0}.top-icon:hover{color:#333}.top-folder{font-size:17px}.mobile-menu{display:none}
    .settings{position:absolute;z-index:6;top:46px;right:18px;width:225px;padding:14px;background:#fff;border:1px solid #e6e6e6;border-radius:12px;box-shadow:0 10px 28px #0002;font-size:13px}.settings[hidden]{display:none}.settings-title{font-weight:700;margin-bottom:12px}.setting-row{display:flex;align-items:center;gap:8px;cursor:pointer}.setting-row input{accent-color:#3289f6}.permission-button{margin-top:10px;padding:7px 9px;border:1px solid #ddd;border-radius:8px;background:#fafafa;font-size:12px}.settings-note{display:block;color:#999;font-size:11px;line-height:1.45;margin-top:9px}
    .conversation{flex:1;overflow:auto;scrollbar-color:#dedede transparent}.messages{width:min(100%,790px);min-height:100%;margin:auto;padding:54px 24px 26px;display:flex;flex-direction:column;justify-content:flex-end;gap:30px}.empty{margin:auto;text-align:center;color:#292929;font-size:24px;font-weight:600}.empty small{display:block;color:#999;font-size:13px;font-weight:400;margin-top:12px}
    .row{display:flex;flex-direction:column;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.65}.row.mine{align-self:flex-end;align-items:flex-end;max-width:73%}.row.theirs{align-self:stretch;align-items:flex-start}.bubble{padding:0;background:none}.mine .bubble{padding:12px 16px;background:#e7f2fc;color:#314456;border-radius:18px}.date-divider,.meta{display:none}
    .typing{align-self:flex-start;color:#a2a4a6;font-size:13px;line-height:1.5}.typing[hidden]{display:none}
    .composer-wrap{padding:14px 24px 19px;background:linear-gradient(transparent,#fff 24%)}.composer{width:min(100%,740px);margin:auto;border:1px solid #e9e9e9;border-radius:24px;box-shadow:0 6px 25px #0000000d;background:#fff;padding:16px 13px 8px}
    textarea{display:block;border:0;outline:0;resize:none;width:100%;min-height:48px;max-height:180px;padding:0 2px;font-size:13px;line-height:1.5;color:#292929;background:transparent}textarea::placeholder{color:#c4c4c4}.composer-actions{display:flex;align-items:center;gap:10px}.composer-plus{border:0;background:transparent;font-size:23px;line-height:1;width:26px;padding:0;color:#292929}.access{font-size:12px;color:#fa6c21}.composer-spacer{flex:1}.model{font-size:12px;color:#3b3f42}.mic{font-size:17px;color:#202326}.send{border:0;border-radius:12px;background:#3d8dff;color:#fff;width:29px;height:29px;display:grid;place-items:center;font-size:20px}.send:disabled{background:#9cc6ff}
    .notice{width:min(100%,740px);margin:0 auto 8px;padding:9px 13px;border-radius:10px;background:#fff5e8;color:#805415;font-size:12px}.notice[hidden]{display:none}
    .toast{position:fixed;z-index:10;right:24px;bottom:24px;max-width:320px;background:#fff;border:1px solid #e5e5e5;border-radius:14px;box-shadow:0 12px 35px #0002;padding:13px 16px;cursor:pointer}.toast[hidden]{display:none}.toast-title{font-weight:700;font-size:13px;margin-bottom:4px}.toast-body{font-size:13px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    [data-editable]{cursor:text}[data-editable][contenteditable]{outline:1px solid #b3b3b3;border-radius:4px}
    @media(max-width:720px){.app{grid-template-columns:0 minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}.windowbar,.rail{display:none}.sidebar{position:absolute;z-index:4;top:0;bottom:0;left:0;width:250px;box-shadow:6px 0 24px #0002;transform:translateX(-110%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.topbar{padding:0 12px}.messages{padding:28px 16px 14px}.row.mine{max-width:88%}.composer-wrap{padding:8px 12px 12px}.settings{right:8px}}
    /* Web ChatGPT layout from the supplied reference. */
    .app{grid-template-columns:333px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
    .windowbar,.rail{display:none}
    .sidebar{background:#f9f9f9;border-right:1px solid #e9e9e9}
    .side-top{height:54px;padding:0 14px;font-size:16px;gap:6px}
    .side-top .side-icon{font-size:20px;color:#818181}
    .side-scroll{padding:18px 6px 18px;scrollbar-width:thin}
    .side-action,.side-entry,.side-folder{height:32px;font-size:12px;color:#343434;padding-left:8px}
    .side-action{margin:0 0 2px}.side-heading{padding:20px 7px 7px;font-size:12px;font-weight:400;color:#9c9c9c}
    .side-section{margin-bottom:12px}.side-entry.selected{background:#ededed}
    .side-footer{height:58px;flex:none;border-top:1px solid #ececec;display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:12px}
    .avatar{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#c9530d;color:#fff;font-size:10px}
    .side-footer small{display:block;color:#767676;font-size:11px;margin-top:2px}
    .topbar{height:50px;min-height:50px;padding:0 16px}.topbar .title,.top-folder{display:none}
    .top-icon{color:#202020}.share{font-size:13px;color:#333;white-space:nowrap}
    .messages{width:min(100%,736px);padding:22px 22px 16px;gap:25px;justify-content:flex-start}
    .row{font-size:13.5px;line-height:1.65;gap:16px}.row.theirs{max-width:100%}.row.mine{max-width:67%;gap:6px}
    .mine .bubble{background:#e7f2fc;color:#1c3852;border-radius:16px;padding:8px 12px}
    .mine .bubble::after{content:"\A\A이 부분과 관련된 맥락도 함께 살펴보고, 자연스러운 흐름으로 조금 더 자세히 설명해 주세요.";white-space:pre-wrap}
    .mine:nth-of-type(3n+2) .bubble::after{content:"\A\A추가로 생각해 볼 부분이 있다면 함께 짚어 주시고, 전체적인 흐름도 이어서 설명해 주세요."}
    .mine:nth-of-type(3n) .bubble::after{content:"\A\A앞에서 이야기한 내용을 바탕으로, 필요한 세부 사항까지 자연스럽게 이어서 정리해 주세요."}
    .typing{font-size:13px;color:#9a9a9a}
    .composer-wrap{padding:7px 22px 20px;background:#fff}
    .composer{width:min(100%,693px);border-radius:25px;padding:7px 11px;box-shadow:0 2px 14px #0000000a;display:flex;align-items:center;gap:12px}
    textarea{min-height:30px;max-height:144px;padding:4px 0;font-size:13.5px;line-height:1.5;order:2;flex:1}textarea::placeholder{color:#999}
    .composer-actions{display:contents}.composer-plus{order:1;font-size:27px;width:26px}.composer-spacer,.access{display:none}
    .model{order:3;color:#888;font-size:12px;white-space:nowrap}.mic{order:4}.send{order:5;border-radius:50%;width:31px;height:31px}
    .notice{width:min(100%,693px)}
    @media(max-width:720px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}.sidebar{width:280px}.mobile-menu{display:block}.topbar{padding:0 12px}.messages{padding:20px 16px}.row.mine{max-width:88%}.composer-wrap{padding:8px 12px 12px}.model{display:none}}
  </style>
</head>
<body>
  <div class="app">
    <div class="windowbar"><span class="arrow">←</span><span class="arrow">→</span><span>◫</span><span data-editable="menu-file">파일</span><span data-editable="menu-edit">편집</span><span data-editable="menu-view">보기</span><span data-editable="menu-help">도움말</span><span class="win-spacer"></span><span class="win-button">−</span><span class="win-button">□</span><span class="win-button">×</span></div>
    <nav class="rail" aria-label="앱 탐색"><button class="rail-icon selected" title="홈">⌂</button><button class="rail-icon tiny" title="작업">▢</button><button class="rail-icon tiny" title="최근">◷</button><button class="rail-icon tiny" title="기록">◎</button><button class="rail-icon tiny" title="더 보기">···</button><span class="dot"></span><button class="rail-icon tiny" title="연결">♧</button><button class="rail-icon tiny" title="앱">⊞</button><span class="spacer"></span><button class="rail-avatar" title="프로필">I</button></nav>
    <aside class="sidebar" id="sidebar">
      <div class="side-top"><span data-editable="brand">ChatGPT</span><span style="font-size:12px;color:#888">⌄</span><span class="spacer"></span><button class="side-icon" title="검색">⌕</button><button class="side-icon" title="사이드바">◫</button></div>
      <div class="side-scroll">
        <div class="side-action"><span>▧</span><span data-editable="new-chat">새 채팅</span></div>
        <div class="side-action"><span>◷</span><span data-editable="schedule-label">예약</span></div>
        <div class="side-action"><span>▥</span><span data-editable="library-label">라이브러리</span></div>
        <div class="side-action"><span>◎</span><span data-editable="plugin-label">플러그인</span></div>
        <div class="side-action"><span>···</span><span data-editable="explore-label">탐색</span></div>
        <div class="side-section"><div class="side-heading" data-editable="pinned-heading">고정된 스레드</div><div class="side-entry selected"><span class="ellipsis" data-editable="chat-name">업무용 이메일 수정</span></div><div class="side-entry"><span data-editable="pinned-two">콘셉트 이미지 제작</span></div><div class="side-entry"><span data-editable="pinned-three">퇴근시간 계산</span></div><div class="side-entry"><span data-editable="pinned-four">제품 형태 학습</span></div></div>
        <div class="side-section"><div class="side-heading" data-editable="project-heading">프로젝트 ›</div></div>
        <div class="side-section"><div class="side-heading" data-editable="recent-heading">최근</div><div class="side-entry"><span data-editable="recent-one">맥 설치창 안뜨게 하기</span></div><div class="side-entry"><span data-editable="recent-two">그레이스케일 이미지 생성</span></div><div class="side-entry"><span data-editable="recent-three">전면 렌더링샷 제작</span></div><div class="side-entry"><span data-editable="recent-four">상단부 투시 수정</span></div><div class="side-entry"><span data-editable="recent-five">용어 번역 요청</span></div></div>
      </div>
      <div class="side-footer"><span class="avatar">HE</span><span><span data-editable="profile-name">김주원</span><small data-editable="profile-plan">Plus</small></span></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="top-icon mobile-menu" id="openMenu" aria-label="메뉴 열기">☰</button><span class="spacer"></span><button class="top-icon" id="settingsButton" title="설정" aria-label="설정">···</button><span class="share" data-editable="share-label">♧ 공유</span></header>
      <div class="settings" id="settings" hidden><div class="settings-title" data-editable="settings-title">설정</div><label class="setting-row"><input id="notifyToggle" type="checkbox" checked><span data-editable="notify-label">메시지 알림</span></label><button class="permission-button" id="permissionButton" type="button">브라우저 알림 허용</button><small class="settings-note" data-editable="settings-note">앱을 닫아도 새 메시지를 알려줍니다.</small></div>
      <section class="conversation" id="conversation" aria-label="대화 내용"><div class="messages" id="messages"><div class="empty" id="empty"><span data-editable="empty-title">무엇을 도와드릴까요?</span><small data-editable="empty-caption">메시지를 입력해 대화를 시작하세요.</small></div><div class="typing" id="typing" role="status" data-editable="typing-label" hidden>답변 작성 중</div></div></section>
      <div class="composer-wrap"><div class="notice" id="notice" data-editable="notice" hidden></div><form class="composer" id="form"><textarea id="messageInput" placeholder="ChatGPT에게 물어보세요" aria-label="메시지 입력" rows="1" maxlength="4000"></textarea><div class="composer-actions"><button class="composer-plus" type="button" aria-label="더하기">+</button><span class="access" data-editable="access-label">ⓘ 전체 액세스</span><span class="composer-spacer"></span><span class="model" data-editable="model-label">Instant⌄</span><span class="mic" aria-hidden="true">♩</span><button class="send" id="send" type="submit" aria-label="메시지 보내기" disabled>↑</button></div></form></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" hidden><div class="toast-title" data-editable="toast-title">새 메시지</div><div class="toast-body" id="toastBody"></div></div>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
